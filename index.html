  <title>Werewolf Manager – Gestion de partie Loup-Garou</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Werewolf Manager",
      "url": "https://hugoerb.github.io/WereWolf-Manager/",
      "description": "Tableau de bord pour préparer et animer une partie de Loup-Garou en tant que Maître du Jeu.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Tout système disposant d’un navigateur web moderne",
      "browserRequirements": "JavaScript requis",
      "inLanguage": "fr-FR",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: { forest: { 950: "#0b1712", 900: "#10251b", 800: "#173528", 700: "#244a38" }, moss: "#7d9872", parchment: "#e8dfca", stonewarm: "#a19c90", amberwood: "#c79745", wolf: "#7b2929" },
        fontFamily: { display: ["Georgia", "Cambria", "serif"] },
        boxShadow: { glow: "0 0 0 1px rgba(199,151,69,.18), 0 24px 60px rgba(0,0,0,.25)" }
      }}
    };
  </script>
  <link rel="stylesheet" href="./styles/custom.css">

<body class="min-h-full bg-forest-950 text-parchment antialiased selection:bg-amberwood selection:text-forest-950">
  <div id="app" class="min-h-screen">
    <main class="mist flex min-h-screen items-center justify-center px-5 py-12">
      <section class="w-full max-w-lg text-center">
        <p class="font-display text-2xl font-semibold tracking-wide text-parchment">Werewolf Manager</p>
        <p class="mt-2 text-xs uppercase tracking-[.22em] text-moss">Maître du village</p>
        <h1 class="mt-10 font-display text-4xl leading-tight text-white sm:text-5xl">Le village s’endort.<br><span class="text-amberwood">À vous de guider la nuit.</span></h1>
        <p class="mx-auto mt-5 max-w-md text-base leading-relaxed text-stone-300">Le tableau de bord privé du Maître du Jeu, de la préparation jusqu’à la victoire.</p>
        <noscript><p class="mx-auto mt-8 max-w-md rounded-xl border border-amberwood/30 bg-amberwood/10 p-4 text-amber-100">Activez JavaScript pour lancer le tableau de bord.</p></noscript>
      </section>
    </main>
  </div>
  <div id="toast-region" aria-live="polite" aria-atomic="true" class="pointer-events-none fixed inset-x-4 top-4 z-[70] flex flex-col items-end gap-2"></div>
  <div id="modal-root"></div>
  <input id="import-input" type="file" accept="application/json,.json" class="sr-only" aria-hidden="true">
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.27.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="./js/app.js"></script>
